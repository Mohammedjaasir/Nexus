[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-app"
version = "0.1.0"
description = "B2a Task 12 fixture: zero dependencies beyond the sde-python image's pytest, build, wheel and setuptools."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
